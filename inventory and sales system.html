<!DOCTYPE html>
<html lang="en-PH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tindahan – Inventory &amp; Sales</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--esp:#2f211b;--brown:#6b4a37;--cara:#a9744f;--sand:#e9e0d7;--bg:#efedea;--card:#faf9f7;--line:#ddd6ce;--ink:#2b2522;--gray:#7b746e;--ok:#5f7a5c;--warn:#b07a2a;--bad:#a4493f;color-scheme:light}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-weight:600}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--esp);color:#d9cdc2;padding:30px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:30px}
.brand{padding:0 10px}.brand h1{font-size:32px;color:#f6efe8;letter-spacing:.04em;line-height:1}.brand small{color:#a89a8d;font-size:12.5px}
nav{display:grid;gap:4px}
nav button{all:unset;cursor:pointer;padding:12px 14px;border-radius:10px;border-left:3px solid transparent;color:#cdbfb2;display:flex;justify-content:space-between;align-items:center;transition:background .2s,color .2s}
nav button:hover{background:#ffffff0f;color:#fff}
nav button.on{background:#ffffff14;color:#fff;border-left-color:var(--cara)}
nav b{font-weight:500;font-size:12px;color:#a89a8d}
nav hr{border:0;border-top:1px solid #ffffff1a;margin:8px 0}
aside .foot{margin-top:auto;font-size:12px;color:#8f8176;padding:0 10px}
main{padding:36px clamp(20px,4vw,52px) 60px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.top h2{font-size:38px;line-height:1.1;color:var(--esp)}.top p{color:var(--gray);font-size:14px}
button.pri{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:10px;padding:11px 20px;color:#fff;background:var(--brown);transition:background .2s}
button.pri:hover{background:var(--esp)}
button.sec{font:inherit;font-weight:500;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:11px 18px}
button.sec:hover{border-color:var(--cara)}
button.dng{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:10px;padding:11px 20px;color:#fff;background:var(--bad)}
:focus-visible{outline:2px solid var(--cara);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.stat small{display:block;color:var(--gray);font-size:13px}.stat strong{display:block;font:600 32px/1.15 "Cormorant Garamond",Georgia,serif;color:var(--esp)}
.stat em{font-style:normal;font-size:12.5px;color:var(--gray)}
button.stat{font:inherit;text-align:left;cursor:pointer;color:inherit;transition:border-color .2s,transform .2s}
button.stat:hover{border-color:var(--cara);transform:translateY(-2px)}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-bottom:14px}
.card h3{font-size:22px;color:var(--esp);margin-bottom:12px}
.chart{display:flex;align-items:flex-end;gap:12px;height:190px;padding-top:10px}
.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;font-size:12px;color:var(--gray)}
.chart i{display:block;width:100%;max-width:54px;border-radius:8px 8px 0 0;background:linear-gradient(var(--cara),var(--brown))}
.chart em{font-style:normal;color:var(--ink);font-size:12px}
.ls p{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.ls p:last-child{border:0}
.ls span{color:var(--gray)}
.go{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
input,select{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus{outline:none;border-color:var(--cara);box-shadow:0 0 0 3px #a9744f26}
.bar input{max-width:340px}.bar select{max-width:220px}
.tw{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
th,td{padding:14px 16px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{font-size:12.5px;color:var(--gray);font-weight:700;background:#f4f1ee}
tr:last-child td{border-bottom:0}
td small{color:var(--gray)}
.r{text-align:right}
tr.hl td{animation:flash 2.4s ease-out}
@keyframes flash{from{background:#efd9c4}to{background:transparent}}
.pill{font-size:12px;font-weight:700;padding:3px 11px;border-radius:999px;background:#e8e3de;color:var(--gray)}
.pill.ok{background:#e3eadf;color:var(--ok)}.pill.warn{background:#f3e8d3;color:var(--warn)}.pill.bad{background:#f0dcd8;color:var(--bad)}
.act{text-align:right}
.lk{all:unset;cursor:pointer;color:var(--brown);font-weight:700;font-size:13.5px;padding:4px 8px;border-radius:6px}
.lk:hover{background:var(--sand)}.lk.d{color:var(--bad)}
.none{padding:44px;text-align:center;color:var(--gray)}
.sb{display:inline-block;width:90px;height:8px;border-radius:5px;background:var(--sand);vertical-align:middle;margin-right:8px}.sb i{display:block;height:100%;border-radius:5px;background:var(--ok)}
.sb.warn i{background:var(--warn)}.sb.bad i{background:var(--bad)}
.adj{display:inline-flex;align-items:center;gap:6px}
.adj button.sq{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font:inherit;font-weight:700}
.adj button.sq:hover{border-color:var(--cara)}
.formcard{max-width:640px}
.formcard h3{font-size:28px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fg .full{grid-column:1/-1}
label{display:grid;gap:5px;font-size:13px;color:var(--gray);font-weight:500}
.err{color:var(--bad);font-size:12px;min-height:15px}
.ft{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:28px;width:min(520px,92vw);box-shadow:0 30px 70px #2f211b55}
dialog::backdrop{background:#2f211b88;backdrop-filter:blur(3px)}
dialog h3{font-size:28px;color:var(--esp);margin-bottom:14px}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);background:var(--esp);color:#f6efe8;padding:11px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:20}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:16px;gap:12px}nav{display:flex;flex-wrap:wrap}nav b,nav hr,aside .foot{display:none}.stats{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.fg{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><h1>Tindahan</h1><small>Inventory &amp; Sales · Philippines</small></div>
    <nav id="nav"></nav>
    <div class="foot">Data is saved in this browser.</div>
  </aside>
  <main>
    <div class="top"><div><h2 id="ttl"></h2><p id="sub"></p></div><div id="acts"></div></div>
    <div id="page"></div>
  </main>
</div>

<dialog id="pd"><form id="pf" novalidate><h3>Edit product</h3><div id="pff"></div><div class="ft"><button type="button" class="sec" data-close="pd">Cancel</button><button class="pri" type="submit">Save changes</button></div></form></dialog>
<dialog id="rd"><form id="rf" novalidate><h3 id="rt"></h3><label>Number of stock to add<input name="add" type="number" min="1" step="1" value="10"><span class="err" data-e="add"></span></label><div class="ft"><button type="button" class="sec" data-close="rd">Cancel</button><button class="pri" type="submit">Add to stock</button></div></form></dialog>
<dialog id="sd"><form id="sf" novalidate><h3 id="sdt"></h3><div class="fg" id="sff"></div><div class="ft"><button type="button" class="sec" data-close="sd">Cancel</button><button class="pri" type="submit">Save sale</button></div></form></dialog>
<dialog id="del"><h3 id="delt">Delete?</h3><p id="dm" style="color:var(--gray)"></p><div class="ft"><button class="sec" data-close="del">Keep it</button><button class="dng" id="dy">Delete</button></div></dialog>
<div id="toast" role="status"></div>

<script>
const KEY="tindahan.ph.v2",LOW=10,$=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"₱"+Number(n).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2});
const num=n=>Number(n).toLocaleString("en-PH");
const dayOf=d=>new Date(d).toLocaleDateString("en-CA",{timeZone:"Asia/Manila"});
const ago=n=>dayOf(Date.now()-n*864e5);
const fdt=a=>new Date(a).toLocaleString("en-PH",{timeZone:"Asia/Manila",month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"});
const uid=()=>(crypto.randomUUID&&crypto.randomUUID())||Date.now().toString(36)+Math.random().toString(36).slice(2);
const PAY=["Cash","GCash","Maya","Card","Bank transfer"];

function seed(){
 const P=[["Lucky Me!","Pancit Canton 60g",16,150],["Datu Puti","Soy Sauce 385ml",24,70],["Datu Puti","Vinegar 385ml",22,64],["Ligo","Sardines in Tomato Sauce 155g",26,95],["Argentina","Corned Beef 150g",38,40],["Great Taste","White Coffee 3-in-1 (10s)",55,52],["Nescafé","Classic Coffee 50g",98,18],["Bear Brand","Fortified Milk 33g",14,80],["C2","Green Tea Apple 230ml",20,0],["Coca-Cola","Coke 1.5L",78,9],["Piattos","Cheese Chips 40g",18,110],["Surf","Powder Detergent 1kg",138,22],["Safeguard","Soap Bar 85g",36,7]].map(a=>({id:uid(),make:a[0],name:a[1],price:a[2],stock:a[3]}));
 const cu=["","Maria Santos","Juan Dela Cruz","Aling Nena’s Carinderia","Roberto Reyes"],pay=["Cash","GCash","Maya","Cash","Card"],S=[];
 for(let i=0;i<24;i++){const p=P[(i*5+2)%P.length],h=String(9+(i*3)%10).padStart(2,"0"),m=String((i*17)%60).padStart(2,"0");
  S.push({id:uid(),no:2001+i,at:`${ago(i%9)}T${h}:${m}:00+08:00`,productId:p.id,make:p.make,name:p.name,price:p.price,qty:(1+((i*5)%6))*(p.price<30?3:1),payment:pay[i%5],customer:cu[i%5]})}
 return{products:P,sales:S};
}
let db=load();
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.products&&r.sales)return r}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
const prod=id=>db.products.find(x=>x.id===id);
const total=s=>s.qty*s.price,sum=(a,f)=>a.reduce((n,x)=>n+f(x),0);
const level=p=>p.stock===0?"bad":p.stock<=LOW?"warn":"ok";
const status=p=>`<span class="pill ${level(p)}">${{bad:"Out of stock",warn:"Low stock",ok:"In stock"}[level(p)]}</span>`;
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2200)}
const stat=(l,v,n,go)=>`<${go?`button data-go="${go}"`:"div"} class="card stat"><small>${l}</small><strong>${v}</strong><em>${n}</em></${go?"button":"div"}>`;

let view="overview",hl=null;
function nav(){const n=[["overview","Overview",""],["add","Add product",""],["products","Products",db.products.length],["inventory","Inventory",db.products.length],["sales","Sales history",db.sales.length]];
 $("#nav").innerHTML=n.map((x,i)=>`${i===1?"<hr>":""}<button data-go="${x[0]}" class="${view===x[0]?"on":""}">${x[1]}<b>${x[2]}</b></button>`).join("")}
document.addEventListener("click",e=>{
 const g=e.target.closest("[data-go]");if(g){view=g.dataset.go;render();scrollTo({top:0});return}
 const c=e.target.closest("[data-close]");if(c)$("#"+c.dataset.close).close();
});
const head=(t,s,a="")=>{$("#ttl").textContent=t;$("#sub").textContent=s;$("#acts").innerHTML=a};

/* shared pieces */
function chart7(){
 const days=[];for(let i=6;i>=0;i--){const d=ago(i);days.push({l:new Date(d+"T00:00:00").toLocaleDateString("en-PH",{weekday:"short"}),v:sum(db.sales.filter(s=>dayOf(s.at)===d),total)})}
 const mx=Math.max(1,...days.map(x=>x.v));
 return`<div class="chart">${days.map(x=>`<div><em>${x.v?"₱"+Math.round(x.v).toLocaleString("en-PH"):""}</em><i style="height:${Math.max(3,x.v/mx*100)}%"></i>${x.l}</div>`).join("")}</div>`;
}
const needs=()=>{const l=db.products.filter(p=>p.stock<=LOW).sort((a,b)=>a.stock-b.stock);return l.length?l.map(p=>`<p><b>${esc(p.make)} ${esc(p.name)}</b><span>${p.stock===0?'<span class="pill bad">Out of stock</span>':p.stock+" left"}</span></p>`).join(""):"<p><span>Everything is well stocked.</span></p>"};
const todayN=()=>dayOf(Date.now());
const makes=()=>[...new Set(db.products.map(p=>p.make))].sort();
function productFields(p){
 return`<div class="fg"><label>Product make (brand)<input name="make" list="mk" maxlength="40" value="${esc(p?.make)}" placeholder="e.g. Lucky Me!"><datalist id="mk">${makes().map(m=>`<option value="${esc(m)}">`).join("")}</datalist><span class="err" data-e="make"></span></label>
 <label>Product name<input name="name" maxlength="60" value="${esc(p?.name)}" placeholder="e.g. Pancit Canton 60g"><span class="err" data-e="name"></span></label>
 <label>Product price (₱)<input name="price" type="number" min="0" step="0.01" value="${p?p.price:""}" placeholder="0.00"><span class="err" data-e="price"></span></label>
 <label>Number of stock<input name="stock" type="number" min="0" step="1" value="${p?p.stock:""}" placeholder="0"><span class="err" data-e="stock"></span></label></div>`;
}
function vProduct(form,curId){
 const v=Object.fromEntries(new FormData(form)),e={};
 const d={make:v.make.trim(),name:v.name.trim(),price:Number(v.price),stock:Number(v.stock)};
 if(!d.make)e.make="Enter the product make or brand.";
 if(!d.name)e.name="Enter the product name.";
 if(v.price===""||isNaN(d.price)||d.price<=0)e.price="Enter a price greater than 0.";
 if(v.stock===""||isNaN(d.stock)||d.stock<0||!Number.isInteger(d.stock))e.stock="Enter a whole number, 0 or more.";
 if(!e.make&&!e.name&&db.products.some(p=>p.id!==curId&&p.make.toLowerCase()===d.make.toLowerCase()&&p.name.toLowerCase()===d.name.toLowerCase()))e.name="This product already exists.";
 form.querySelectorAll(".err").forEach(x=>x.textContent=e[x.dataset.e]||"");
 return Object.keys(e).length?null:d;
}

/* views */
function render(){nav();({overview,add,products,inventory,sales})[view]()}

function overview(){
 const tn=todayN(),ts=db.sales.filter(s=>dayOf(s.at)===tn);
 head("Overview","Pick a section below, or click any card to open it.",'<button class="sec" id="rs">Reset demo data</button>');
 $("#rs").onclick=()=>{db=seed();save();render();toast("Demo data restored")};
 $("#page").innerHTML=`<div class="stats">${stat("Products",db.products.length,makes().length+" makes (brands)","products")}${stat("Units in stock",num(sum(db.products,p=>p.stock)),"see the inventory","inventory")}${stat("Needs restocking",db.products.filter(p=>p.stock<=LOW).length,db.products.filter(p=>p.stock===0).length+" out of stock","inventory")}${stat("Today’s sales",money(sum(ts,total)),ts.length+" sales today","sales")}</div>
 <div class="two"><div class="card"><h3>Revenue, last 7 days</h3>${chart7()}</div><div class="card ls"><h3>Latest sales</h3>${[...db.sales].sort((a,b)=>b.at.localeCompare(a.at)||b.no-a.no).slice(0,5).map(s=>`<p><b>#${s.no} ${esc(s.make)} ${esc(s.name)}</b><span>${money(total(s))}</span></p>`).join("")||"<p><span>No sales yet.</span></p>"}</div></div>
 <div class="go"><button class="pri" data-go="add">+ Add a product</button><button class="pri" data-go="products">View products</button><button class="pri" data-go="inventory">Open inventory</button><button class="pri" data-go="sales">Sales history</button></div>`;
}

function add(){
 head("Add product","Fill in the four details, then save. The product will appear in your list.");
 $("#page").innerHTML=`<form id="af" class="card formcard" novalidate><h3>New product</h3>${productFields()}<div class="ft"><button type="reset" class="sec">Clear</button><button class="pri" type="submit">Add product</button></div></form>`;
 $("#af").onsubmit=e=>{e.preventDefault();const d=vProduct(e.target);if(!d)return;
  const p={id:uid(),...d};db.products.push(p);save();hl=p.id;view="products";render();toast("Product added to your list")};
 $("#af").elements.make.focus();
}

function table(cols,id){return`<div class="tw"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody id="${id}"></tbody></table><div class="none" id="none" hidden></div></div>`}
const none=(n,t)=>{$("#none").hidden=n>0;$("#none").textContent=t};

function products(){
 head("Products","Your full list of products with their make, price and stock.",'<button class="pri" data-go="add">+ Add product</button>');
 $("#page").innerHTML=`<div class="stats">${stat("Products",db.products.length,"in your list")}${stat("Makes (brands)",makes().length,"different brands")}${stat("Units in stock",num(sum(db.products,p=>p.stock)),"across all products")}${stat("Retail value",money(sum(db.products,p=>p.stock*p.price)),"stock × price")}</div>
 <div class="bar"><input id="q" type="search" placeholder="Search by make or product name" aria-label="Search"><select id="mf" aria-label="Filter by make"><option value="">All makes</option>${makes().map(m=>`<option>${esc(m)}</option>`).join("")}</select></div>
 ${table(["Make","Product name","Price","Stock","Status",""],"tb")}`;
 const rows=()=>{const q=$("#q").value.toLowerCase().trim(),m=$("#mf").value;
  const l=db.products.filter(p=>(!m||p.make===m)&&(!q||`${p.make} ${p.name}`.toLowerCase().includes(q))).sort((a,b)=>a.make.localeCompare(b.make)||a.name.localeCompare(b.name));
  $("#tb").innerHTML=l.map(p=>`<tr class="${p.id===hl?"hl":""}"><td><strong>${esc(p.make)}</strong></td><td>${esc(p.name)}</td><td>${money(p.price)}</td><td>${p.stock}</td><td>${status(p)}</td><td class="act"><button class="lk" data-a="ep" data-id="${p.id}">Edit</button><button class="lk d" data-a="dp" data-id="${p.id}">Delete</button></td></tr>`).join("");
  none(l.length,"No products found. Use “Add product” to create one.")};
 $("#q").oninput=rows;$("#mf").onchange=rows;rows();hl=null;
}

function inventory(){
 head("Inventory","Check stock levels and restock what is running low.");
 $("#page").innerHTML=`<div class="stats">${stat("Units in stock",num(sum(db.products,p=>p.stock)),"all products")}${stat("Inventory value",money(sum(db.products,p=>p.stock*p.price)),"at selling price")}${stat("Low stock",db.products.filter(p=>p.stock>0&&p.stock<=LOW).length,"at "+LOW+" or fewer")}${stat("Out of stock",db.products.filter(p=>p.stock===0).length,"need restocking now")}</div>
 <div class="card ls" style="margin-bottom:14px"><h3>Needs restocking</h3>${needs()}</div>
 <div class="bar"><input id="q" type="search" placeholder="Search inventory" aria-label="Search"></div>
 ${table(["Make","Product name","Stock level","Status","Adjust stock"],"tb")}`;
 const rows=()=>{const q=$("#q").value.toLowerCase().trim();
  const l=db.products.filter(p=>!q||`${p.make} ${p.name}`.toLowerCase().includes(q)).sort((a,b)=>a.stock-b.stock);
  $("#tb").innerHTML=l.map(p=>`<tr><td><strong>${esc(p.make)}</strong></td><td>${esc(p.name)}</td><td><span class="sb ${level(p)}"><i style="width:${Math.min(100,p.stock/60*100)}%"></i></span><b>${p.stock}</b></td><td>${status(p)}</td><td><span class="adj"><button class="sq" aria-label="Remove one" data-a="dec" data-id="${p.id}">−</button><button class="sq" aria-label="Add one" data-a="inc" data-id="${p.id}">+</button><button class="lk" data-a="rs" data-id="${p.id}">Restock</button></span></td></tr>`).join("");
  none(l.length,"No products found.")};
 $("#q").oninput=rows;rows();
}

function sales(){
 const tn=todayN(),ts=db.sales.filter(s=>dayOf(s.at)===tn),tot=sum(db.sales,total);
 head("Sales history","Every sale you have recorded, newest first.",'<button class="pri" id="ns">+ Record sale</button>');
 $("#ns").onclick=()=>openSale();
 $("#page").innerHTML=`<div class="stats">${stat("Total sales",money(tot),"incl. 12% VAT ≈ "+money(tot/1.12*0.12))}${stat("Transactions",db.sales.length,"recorded sales")}${stat("Units sold",num(sum(db.sales,s=>s.qty)),"avg sale "+money(db.sales.length?tot/db.sales.length:0))}${stat("Today’s sales",money(sum(ts,total)),ts.length+" sales today")}</div>
 <div class="bar"><input id="q" type="search" placeholder="Search by product, customer or payment" aria-label="Search"></div>
 ${table(["Sale","Date &amp; time","Product","Qty","Unit price","Total","Payment","Customer",""],"tb")}`;
 const rows=()=>{const q=$("#q").value.toLowerCase().trim();
  const l=db.sales.filter(s=>!q||`${s.no} ${s.make} ${s.name} ${s.customer} ${s.payment}`.toLowerCase().includes(q)).sort((a,b)=>b.at.localeCompare(a.at)||b.no-a.no);
  $("#tb").innerHTML=l.map(s=>`<tr><td><strong>#${s.no}</strong></td><td>${fdt(s.at)}</td><td><strong>${esc(s.make)}</strong> ${esc(s.name)}</td><td>${s.qty}</td><td>${money(s.price)}</td><td><strong>${money(total(s))}</strong></td><td><span class="pill">${esc(s.payment)}</span></td><td>${esc(s.customer||"Walk-in")}</td><td class="act">${prod(s.productId)?`<button class="lk" data-a="es" data-id="${s.id}">Edit</button>`:""}<button class="lk d" data-a="ds" data-id="${s.id}">Void</button></td></tr>`).join("");
  none(l.length,"No sales yet. Use “Record sale” to add one.")};
 $("#q").oninput=rows;rows();
}

/* actions */
let cur=null,onDel=null;
$("#page").addEventListener("click",e=>{
 const b=e.target.closest("[data-a]");if(!b)return;const id=b.dataset.id,a=b.dataset.a;
 const p=prod(id),s=db.sales.find(x=>x.id===id);
 if(a==="ep"&&p){cur=p;$("#pff").innerHTML=productFields(p);$("#pd").showModal()}
 if(a==="dp"&&p)confirmDel("Delete this product?",`${p.make} ${p.name} will be removed. Past sales keep their history.`,()=>{db.products=db.products.filter(x=>x.id!==p.id);toast("Product deleted")});
 if(a==="inc"&&p){p.stock++;save();render()}
 if(a==="dec"&&p){p.stock=Math.max(0,p.stock-1);save();render()}
 if(a==="rs"&&p){cur=p;$("#rt").textContent=`Restock ${p.make} ${p.name}`;$("#rf").reset();$("#rf").querySelector(".err").textContent="";$("#rd").showModal()}
 if(a==="es"&&s)openSale(s);
 if(a==="ds"&&s)confirmDel("Void this sale?",`Sale #${s.no} will be removed${prod(s.productId)?" and the items returned to stock":""}.`,()=>{const q=prod(s.productId);if(q)q.stock+=s.qty;db.sales=db.sales.filter(x=>x.id!==s.id);toast("Sale voided")});
});
function confirmDel(t,m,fn){$("#delt").textContent=t;$("#dm").textContent=m;onDel=fn;$("#del").showModal()}
$("#dy").onclick=()=>{onDel();save();$("#del").close();render()};

$("#pf").onsubmit=e=>{e.preventDefault();const d=vProduct(e.target,cur.id);if(!d)return;Object.assign(cur,d);save();$("#pd").close();render();toast("Product updated")};
$("#rf").onsubmit=e=>{e.preventDefault();const n=Number(new FormData(e.target).get("add"));
 if(!Number.isInteger(n)||n<1){e.target.querySelector(".err").textContent="Enter a whole number of 1 or more.";return}
 cur.stock+=n;save();$("#rd").close();render();toast(`Added ${n} to stock`)};

function openSale(s){
 cur=s||null;
 if(!s&&!db.products.some(p=>p.stock>0)){toast("No products in stock to sell");return}
 $("#sdt").textContent=s?`Edit sale #${s.no}`:"Record sale";
 const opts=[...db.products].sort((a,b)=>a.make.localeCompare(b.make)||a.name.localeCompare(b.name)).map(p=>`<option value="${p.id}"${s&&s.productId===p.id?" selected":""}${p.stock===0&&!(s&&s.productId===p.id)?" disabled":""}>${esc(p.make)} ${esc(p.name)} · ${money(p.price)} · ${p.stock} in stock</option>`).join("");
 $("#sff").innerHTML=`<label class="full">Product<select name="productId">${opts}</select><span class="err" data-e="productId"></span></label>
 <label>Quantity<input name="qty" type="number" min="1" step="1" value="${s?s.qty:1}"><span class="err" data-e="qty"></span></label>
 <label>Payment method<select name="payment">${PAY.map(x=>`<option${s&&s.payment===x?" selected":""}>${x}</option>`).join("")}</select></label>
 <label class="full">Customer (optional)<input name="customer" maxlength="50" value="${esc(s?.customer)}" placeholder="Walk-in"></label>`;
 if(!s){const f=$("#sff").querySelector("select");const first=[...f.options].find(o=>!o.disabled);if(first)f.value=first.value}
 $("#sd").showModal();
}
$("#sf").onsubmit=e=>{
 e.preventDefault();const v=Object.fromEntries(new FormData(e.target)),p=prod(v.productId),q=Number(v.qty),er={};
 if(!p)er.productId="Choose a product.";
 if(!Number.isInteger(q)||q<1)er.qty="Enter a whole number of 1 or more.";
 else if(p){const avail=p.stock+(cur&&cur.productId===p.id?cur.qty:0);if(q>avail)er.qty=`Only ${avail} in stock.`}
 e.target.querySelectorAll(".err").forEach(x=>x.textContent=er[x.dataset.e]||"");
 if(Object.keys(er).length)return;
 if(cur){const old=prod(cur.productId);if(old)old.stock+=cur.qty}
 p.stock-=q;
 const same=cur&&cur.productId===p.id,rec={productId:p.id,make:p.make,name:p.name,price:same?cur.price:p.price,qty:q,payment:v.payment,customer:v.customer.trim()};
 if(cur)Object.assign(cur,rec);else db.sales.push({id:uid(),no:Math.max(2000,...db.sales.map(x=>x.no))+1,at:new Date().toISOString(),...rec});
 save();$("#sd").close();render();toast(cur?"Sale updated":"Sale recorded");
};
render();
</script>
</body>
</html>
